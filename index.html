<script>
// 清理托管平台注入的底部广告链接（服务端注入的内联样式无法用 CSS 覆盖）
(function () {
    function cleanHostAds() {
        try {
            document.querySelectorAll('a[href^="https://htmlhoster.com/?ref="]').forEach(function (a) {
                var p = a.parentElement;
                if (p) { p.remove(); }
                else { a.remove(); }
            });
        } catch (e) {}
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', cleanHostAds);
    } else {
        cleanHostAds();
    }
    // 兜底：延迟再清理一次（防止动态插入）
    setTimeout(cleanHostAds, 500);
})();
</script>
